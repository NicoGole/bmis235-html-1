  <style>
    :root {
      --ink: #0d0c0b;
      --paper: #f4efe7;
      --muted: #a39b8f;
      --accent: #b3261e;
      --rule: rgba(244, 239, 231, 0.18);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: "Inter", Arial, sans-serif;
      font-weight: 300;
      line-height: 1.7;
    }

    img { display: block; max-width: 100%; }

    /* ---------- Sticky navigation ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6%;
      background: rgba(13, 12, 11, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }

    nav .logo {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    nav ul {
      display: flex;
      gap: 28px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: var(--paper);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    nav a:hover { color: var(--accent); }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      height: 88vh;
      min-height: 480px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--ink) 5%, rgba(13, 12, 11, 0.2) 60%);
    }

    .hero-text {
      position: relative;
      z-index: 1;
      padding: 0 6% 64px;
      max-width: 900px;
    }

    .kicker {
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 12px;
    }

    .hero h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.5rem, 9vw, 7.5rem);
      line-height: 0.95;
      margin: 0;
      letter-spacing: -1px;
    }

    .hero .deck {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      margin: 18px 0 0;
    }

    /* ---------- Sections ---------- */
    section {
      padding: 110px 6%;
      border-top: 1px solid var(--rule);
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 16px;
      font-weight: 600;
    }

    h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      line-height: 1.1;
      margin: 0 0 28px;
    }

    .intro {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 60px;
    }

    .lede {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.5rem;
      line-height: 1.5;
      margin: 0;
    }

    .body-copy p,
    .style-copy p,
    .timeline p {
      color: #d8d1c6;
      margin: 0 0 1.2em;
    }

    figure { margin: 0; overflow: hidden; }

    figcaption {
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 14px;
      border-top: 1px solid var(--rule);
      padding-top: 10px;
    }
